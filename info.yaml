# Tiny Tapeout project information
project:
  title:        "neural"      # Project title
  author:       "chrome chains"      # Your name
  discord:      "no"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "digit recognition"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "3x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_neural"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "topmodule.v"
    - "controller.v"
    - "argmax.v"
    - "zero_skip_pixel_serial.v"
    - "ternary_mac_L1.v"
    - "ternary_mac_L2.v"
    - "rekwantisatie.v"
    - "rekwantisatie_rom.v"
    - "l1_weight_rom.v"
    - "l2_weight_rom.v"
    - "l2_bias.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "w1"
  ui[1]: "w2"
  ui[2]: "w3"
  ui[3]: "w4"
  ui[4]: "w5"
  ui[5]: "w6"
  ui[6]: "w7"
  ui[7]: "w8"

  # Outputs
  uo[0]: "o1"
  uo[1]: "o2"
  uo[2]: "o3"
  uo[3]: "o4"
  uo[4]: "o5"
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "w9"
  uio[1]: "w10"
  uio[2]: "w11"
  uio[3]: "w12"
  uio[4]: "w13"
  uio[5]: "w14"
  uio[6]: "w15"
  uio[7]: "w16"

# Do not change!
yaml_version: 6
