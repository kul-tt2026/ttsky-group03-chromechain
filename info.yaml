# Tiny Tapeout project information
project:
  title:        "Chrome Chain"
  author:       "KU Leuven TT2026 Group 03"
  discord:      ""
  description:  "Ternary bit-serial MNIST classifier with a distribution-free conformal early exit"
  language:     "Verilog"

  # 10 MHz for bring-up, NOT the ceiling. The synthesis flow reports a 27.0 ns critical
  # path for the wrapped top (abc, sky130 tt_025C_1v80, pre-P&R) -- about 37 MHz -- and
  # that path is the whole pixel chain in one cycle: plane buffer -> popcount -> pixel
  # scanner -> W1 ROM -> 32 MAC lanes -> accumulator. The individual blocks are all fast
  # (exit_tree_2stage 8.6 ns, l1_horner_acc 7.2 ns); the composition is not. Every claim
  # this design makes is about CYCLES, which do not depend on the clock, so running
  # slower costs the design nothing. Raise this only after real STA post-P&R.
  clock_hz:     10000000

  # 6.22 tiles, measured on a flattened synthesis of tt_um_kul_chromechain against the
  # same liberty and tile denominator as every other number in the design repo. 4x2 is
  # the smallest standard size that fits; 3x2 (6 tiles) does not, even pre-P&R.
  tiles: "3x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_kul_chromechain"

  # Every module the design instantiates. Must stay identical to PROJECT_SOURCES in
  # test/Makefile -- letting those two drift is a standard TT trap. ckpt_defs.vh is
  # `included by most of these and lives in src/ as well, but it is a header, not a
  # source file, so it is not listed.
  #
  # NOT listed, deliberately: project.v, ReLU.v, argmax.v, rekwantisatie.v,
  # rekwantisatie_rom.v, ternary_mac_L1.v, ternary_mac_L2.v, zero_skip_pixel_serial.v.
  # Those are a parallel line of work; they stay in src/ untouched.
  source_files:
    - "tt_um_kul_chromechain.v"
    - "cc_top.v"
    - "top_fsm.v"
    - "blob_loader.v"
    - "w1_rom_final4.v"
    - "ckpt_block.v"
    - "bitplane_buffer.v"
    - "popcount.v"
    - "active_pixel_scan.v"
    - "l1_horner_acc.v"
    - "l1_horner_cnt.v"
    - "l1_acc_shadow.v"
    - "l1_acc_shadow_cg.v"
    - "checkpoint_ctrl.v"
    - "requant_rom_x4.v"
    - "l2_weight_rom_x4.v"
    - "config_latch.v"
    - "requant_unit.v"
    - "l2_mac_x4.v"
    - "max2_node.v"
    - "exit_tree_2stage.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs -- one 8 b data bus, shared by pixel beats and config words. They are never
  # live at once: config loads only while no image is running (enforced by K12).
  ui[0]: "DATA0"
  ui[1]: "DATA1"
  ui[2]: "DATA2"
  ui[3]: "DATA3"
  ui[4]: "DATA4"
  ui[5]: "DATA5"
  ui[6]: "DATA6"
  ui[7]: "DATA7"

  # Outputs -- view 0 of the status mux (DFT_SEL = 0). Views 1-3 carry the config
  # readback, the exit index, and the five sticky alarms individually.
  uo[0]: "ANSWER0"
  uo[1]: "ANSWER1"
  uo[2]: "ANSWER2"
  uo[3]: "ANSWER3"
  uo[4]: "DONE"
  uo[5]: "LD_READY"
  uo[6]: "BUSY"
  uo[7]: "ERR"

  # Bidirectional pins -- all inputs (uio_oe = 0), control only. The chip never drives
  # them, so there is no direction hazard.
  uio[0]: "LD_EN"
  uio[1]: "LD_VSTROBE"
  uio[2]: "CFG_MODE"
  uio[3]: "CFG_STB"
  uio[4]: "START"
  uio[5]: "DFT_SEL0"
  uio[6]: "DFT_SEL1"
  uio[7]: "RESERVED"

# Do not change!
yaml_version: 6
